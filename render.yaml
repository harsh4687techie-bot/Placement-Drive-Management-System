services:
  - type: web
    name: placement-drive-management-system
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATA_DIR
        value: /data
      - key: BACKUP_DIR
        value: /backups
      - key: REPORT_DIR
        value: /reports
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx512m"

    # NOTE FOR RENDER PERSISTENT DISK:
    # On the free tier, the container filesystem is ephemeral (resets on restart/deploy).
    # If using Render Starter or higher plan ($7/mo), you can attach a persistent disk:
    # disk:
    #   name: placement-data
    #   mountPath: /data
    #   sizeGB: 1
