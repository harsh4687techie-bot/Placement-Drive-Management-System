server.port=${PORT:8080}
spring.application.name=placement-drive-management-system

# Storage Configuration
# Configurable via DATA_DIR environment variable or system property
app.storage.data-dir=${DATA_DIR:./data}
app.storage.backup-dir=${BACKUP_DIR:./backups}
app.storage.report-dir=${REPORT_DIR:./reports}

# Load sample demo data automatically on first run if data directory is empty
app.demo.auto-load-if-empty=true

# Spring Web Configuration
spring.web.resources.add-mappings=true
spring.web.resources.static-locations=classpath:/static/

# Maximum upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
